[project]
name = "terrarium"
version = "0.1.0"
description = "Geopolitics Terrarium - meta-security sandbox simulation (Hackathon vol.2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=8.0",
    "pandas>=2.2",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrarium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
