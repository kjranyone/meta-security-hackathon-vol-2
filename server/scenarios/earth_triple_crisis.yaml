interventions:
  - tick: 6
    type: close_chokepoint
    params: {chokepoint: "Strait of Hormuz", duration: 30}
  - tick: 8
    type: close_chokepoint
    params: {chokepoint: "Taiwan Strait", duration: 28}
  - tick: 10
    type: close_chokepoint
    params: {chokepoint: "Suez Canal", duration: 26}
  - tick: 14
    type: global_slider
    params: {param: food_yield, value: 0.8}
