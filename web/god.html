<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Geopolitics Terrarium — 神の玉座</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --god:#a371f7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:13px/1.5 "Helvetica Neue",Arial,sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:10px; padding:7px 14px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; }
  #conn { font-size:11px; padding:2px 8px; border-radius:10px; background:#21262d; }
  #conn.ok { color:#3fb950; } #conn.bad { color:#f85149; }
  .spacer { flex:1; }
  select, input[type=number] { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 6px; }
  button { background:#21262d; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.godbtn { border-color:var(--god); color:var(--god); }
  button.godbtn:hover { background:rgba(163,113,247,.15); }
  #main { display:flex; flex:1; min-height:0; }
  #mapwrap { flex:1.5; position:relative; background:#0a0e14; min-width:0; display:flex; align-items:center; justify-content:center; }
  canvas#map { cursor:pointer; max-width:100%; max-height:100%; }
  #side { width:480px; border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
  #stats { height:200px; flex:none; }
  /* ---- draggable splitters（ペインのドラッグ拡大・縮小） ---- */
  #vsplit { flex:0 0 7px; cursor:col-resize; background:var(--border); position:relative; }
  #vsplit::before { content:""; position:absolute; inset:0 -8px; }
  #vsplit::after { content:"⇔"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--dim); font-size:11px; opacity:0; transition:opacity .15s; }
  #vsplit:hover::after, #vsplit.drag::after { opacity:1; }
  #vsplit:hover, #vsplit.drag { background:var(--god); }
  .hsplit { flex:0 0 7px; cursor:row-resize; background:var(--border); position:relative; }
  .hsplit::before { content:""; position:absolute; inset:-8px 0; }
  .hsplit::after { content:"⇕"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--dim); font-size:11px; opacity:0; transition:opacity .15s; }
  .hsplit:hover::after, .hsplit.drag::after { opacity:1; }
  .hsplit:hover, .hsplit.drag { background:var(--god); }
  .pane { border-bottom:1px solid var(--border); padding:8px 10px; overflow:auto; }
  .pane h3 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  #godpane { max-height:300px; background:rgba(163,113,247,.04); }
  #stats { max-height:180px; }
  #feed { flex:1; min-height:0; }
  #feed .ev { padding:3px 6px; border-radius:4px; margin-bottom:2px; }
  #feed .ev .t { color:var(--dim); font-size:11px; margin-right:6px; }
  .ev-war { border-left:3px solid #f85149; } .ev-collapse { border-left:3px solid #d29922; }
  .ev-god { border-left:3px solid #a371f7; background:rgba(163,113,247,.08); }
  .ev-shortage { border-left:3px solid #db6d28; } .ev-sanction,.ev-threat { border-left:3px solid #d29922; }
  .ev-alliance { border-left:3px solid #3fb950; } .ev-price,.ev-trade { border-left:3px solid #e3b341; }
  .ev-disinfo { border-left:3px solid #f778ba; } .ev-default { border-left:3px solid #ff6b35; background:rgba(255,107,53,.08); }
  .ev-credhit { border-left:3px solid #ffa657; }
  .ev-tech { border-left:3px solid #3fdeff; background:rgba(63,222,255,.07); } .ev-tech2 { border-left:3px solid #2f9c99; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { color:var(--dim); font-weight:500; text-align:left; }
  td,th { padding:2px 5px 2px 0; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  #timeline { display:flex; align-items:center; gap:10px; padding:7px 14px; border-top:1px solid var(--border); background:var(--panel); }
  #ticklabel { font-variant-numeric:tabular-nums; min-width:110px; color:var(--dim); }
  .cardrow { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0; }
  .card { border:1px solid var(--border); border-radius:8px; padding:6px 8px; background:#161b22; }
  .card b { font-size:12px; color:var(--god); }
  .hint { color:var(--dim); font-size:11px; }
  .legend { top:10px; max-width:44%;  position:absolute; left:10px; bottom:10px; font-size:11px; color:var(--dim); background:rgba(13,17,23,.75); padding:6px 8px; border-radius:6px; }
  label.sl { display:flex; align-items:center; gap:6px; font-size:11px; margin:2px 0; }
  label.sl span { width:120px; color:var(--dim); }
  label.sl input[type=range] { flex:1; }
  label.sl output { width:44px; text-align:right; }
  #datebar { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5;
             background:rgba(13,17,23,.85); border:1px solid var(--border); border-radius:8px;
             padding:4px 14px; font-size:15px; letter-spacing:.06em; font-variant-numeric:tabular-nums;
             max-width:50%; text-align:center; }
  @media (max-width: 1100px) { #datebar { font-size:12.5px; padding:3px 10px; } .legend { font-size:10px; max-width:40%; } }
  #datebar small { color:var(--dim); font-size:11px; display:block; text-align:center; letter-spacing:0; }
  #godbar { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:4;
            display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
            background:rgba(13,17,23,.88); border:1px solid var(--border); border-radius:12px;
            padding:7px 10px; max-width:calc(100% - 24px); box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #godbar .tgt { font-size:11.5px; color:var(--dim); border-right:1px solid var(--border); padding-right:8px; margin-right:2px; }
  #godbar .tgt b { color:var(--god); }
  #godbar button { background:#21262d; border:1px solid var(--border); color:var(--text); border-radius:8px;
                   padding:5px 9px; cursor:pointer; font-size:12.5px; white-space:nowrap; }
  #godbar button:hover:not(:disabled) { border-color:var(--god); }
  #godbar button:disabled { opacity:.38; cursor:not-allowed; }
  #godbar select { background:var(--bg); border:1px solid var(--border); color:var(--text);
                   border-radius:6px; font-size:12px; padding:3px 4px; }
  #timeline.flash { animation: tlgrow .9s ease-out 2; }
  @keyframes tlgrow { 0% { box-shadow: inset 0 3px 8px rgba(163,113,247,0); } 30% { box-shadow: inset 0 3px 10px rgba(163,113,247,.6); } 100% { box-shadow: inset 0 3px 8px rgba(163,113,247,0); } }
  #mutebtn { width:40px; }
</style>
</head>
<body>
<header>
  <h1>👑 Geopolitics Terrarium — 神の玉座</h1>
  <span id="conn" class="bad">接続中…</span>
  <span class="spacer"></span>
  <select id="preset">
    <option value="earth" selected>earth（実世界16国）</option>
    <option value="default">default（架空8国）</option>
    <option value="gen">gen（自動生成 seed=7）</option>
  </select>
  <select id="policy">
    <option value="mock_llm" selected>mock_llm（オフライン）</option>
    <option value="heuristic">heuristic</option>
    <option value="llm">llm（z.ai / 要APIキー）</option>
    <option value="rl">rl（要rl-nation）</option>
  </select>
  <input type="number" id="seed" value="42" style="width:64px" title="seed">
  <input type="number" id="rl-nation" placeholder="RL国(VLT等)" style="width:100px" title="rl-nation（policy=rl/hybrid時）">
  <button onclick="resetWorld()">🌍 世界を創る</button>
</header>
<div id="main">
  <div id="mapwrap">
    <canvas id="map" width="960" height="540"></canvas>
    <div class="legend" style="top:10px; bottom:auto;">クリック: 海峡⚓=封鎖 / 国家=介入カード。紫=航路(エネルギー) 緑=食料 青=チップ 紫=地下 水色=宇宙・ ⚔️戦争 💀崩壊 橙枠=破綻<br><span style="color:#3fb950">緑=高信頼</span> / 灰=中立 / <span style="color:#f85149">赤=敵対</span> = 友好度線</div>
    <div id="datebar" style="display:none">—</div>
    <div id="godbar"></div>
  </div>
  <div id="vsplit" title="ドラッグで幅変更・ダブルクリックで戻す"></div>
  <div id="side">
    <div class="pane" id="godpane">
      <h3>⚡ 神の介入 <span id="godtarget" style="color:var(--god)"></span></h3>
      <div id="godbody" class="hint">地図の海峡⚓または国家をクリックして介入カードを選べる。何も選んでいないときは世界パラメータ。</div>
    </div>
    <div class="pane" id="stats"><h3>Nations</h3><div id="statbody">—</div></div>
    <div class="hsplit" data-pane="stats" title="ドラッグで高さ変更・ダブルクリックで戻す"></div>
    <div class="pane" id="feed"><h3>Event cascade <span id="cascadeinfo" style="color:var(--accent)"></span></h3><div id="feedbody">—</div></div>
  </div>
</div>
<div id="timeline">
  <button id="play" onclick="togglePlay()">▶ 再生</button>
  <button onclick="send({cmd:'step'})">⏭ 1tick</button>
  <span id="ticklabel">tick —</span>
  <label class="sl" style="flex:1"><span>速度</span><input type="range" min="200" max="3000" value="1200" oninput="send({cmd:'speed', ms:+this.value})"><output id="speedout">1200ms</output></label>
  <button id="mutebtn" onclick="toggleMute()" title="イベント音の切替">🔊</button>
</div>
<script>
"use strict";
// ---------------------------------------------------------------- state
let META=null, TICKS=[], GEO=null, GOD_EVENTS=[], cur=0, sel={kind:null, id:null};
let VIEW={scale:2.4, ox:0, oy:0};
const COMMO_COLOR={energy:"rgba(227,179,65,.5)",food:"rgba(124,179,66,.5)",chips:"rgba(88,166,255,.5)",minerals:"rgba(210,168,255,.5)",space:"rgba(63,222,255,.5)"};
const TECHS=["drone_swarm","laser_defense","cyber_arsenal","hypersonic_intercept","ai_fab","biomanuf","autofactory","deepsea_mining","fusion","space_solar","asteroid_mining","ai_religion","techno_nationalism"];
const RESOURCES=["oil","gas","grain","fab","mineral","orbit"];

// ---------------------------------------------------------------- ws
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { document.getElementById("conn").textContent="接続中"; document.getElementById("conn").className="ok"; };
  ws.onclose = () => { document.getElementById("conn").textContent="切断"; document.getElementById("conn").className="bad"; setTimeout(connect, 1500); };
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "meta") { META = m; await loadGeo(); TICKS=[]; GOD_EVENTS=[]; cur=0; render(0); }
    else if (m.type === "tick") {
    TICKS.push(m); cur = TICKS.length-1;
    const types = (m.events || []).map(e => e.type).filter(t => MAJOR_TYPES[t]);
    if (types.length) majorFeedback(types);
    render(cur);
  }
    else if (m.type === "god") { if (m.event) { GOD_EVENTS.push(m.event); majorFeedback(["god_intervention"]); if (TICKS.length) render(cur); } }
    else if (m.type === "status") { document.getElementById("ticklabel").textContent=`tick ${m.tick}/${m.max_ticks} ${m.running?"▶":"⏸"}`; document.getElementById("play").textContent = m.running?"⏸ 停止":"▶ 再生"; }
    else if (m.type === "end") { document.getElementById("ticklabel").textContent = `tick ${m.tick}/${m.max_ticks} 終了`; }
  };
}
function send(obj) { if (ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }
function intervene(type, params) { send({cmd:"intervene", type, params: params||{}}); }
function togglePlay() { send({cmd: TICKS.length && document.getElementById("play").textContent.startsWith("▶") ? "play":"pause"}); }
async function resetWorld() {
  const p = document.getElementById("preset").value;
  const body = { preset: p==="gen" ? "default" : p, policy: document.getElementById("policy").value,
                 seed:+document.getElementById("seed").value||42, ticks: 60 };
  if (p==="gen") body.gen_seed = 7;
  const rn = document.getElementById("rl-nation").value.trim();
  if (rn) body.rl_nation = rn;
  await fetch("/api/reset", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
}

// ---------------------------------------------------------------- geo
function project(lon,lat){ return [VIEW.ox+(lon+180)*VIEW.scale, VIEW.oy+(90-lat)*VIEW.scale]; }
function unproject(x,y){ return [(x-VIEW.ox)/VIEW.scale-180, 90-(y-VIEW.oy)/VIEW.scale]; }
async function loadGeo() {
  if (GEO) return;
  const data = await (await fetch("/static/web/world.geojson")).json();
  const features=[]; const byName={};
  for (const f of data.features) {
    const admin=f.properties.ADMIN||f.properties.NAME||""; const rings=[]; const g=f.geometry;
    if (!g) continue;
    if (g.type==="Polygon") rings.push(g.coordinates[0]);
    else if (g.type==="MultiPolygon") for (const p of g.coordinates) rings.push(p[0]);
    features.push({admin, rings}); if(!byName[admin]) byName[admin]=features.length-1;
  }
  GEO={features, byName};
  fitMapCanvas();
}

// ---------------------------------------------------------------- render
function evRow(e) {
  const CLS={war_start:"ev-war",war_end:"ev-war",collapse:"ev-collapse",god_intervention:"ev-god",shortage:"ev-shortage",
    sanction:"ev-sanction",threat:"ev-sanction",alliance_formed:"ev-alliance",price_spike:"ev-price",disinfo:"ev-disinfo",
    trade_throttled:"ev-trade",sovereign_default:"ev-default",credibility_hit:"ev-credhit",tech_emergence:"ev-tech",tech_adopted:"ev-tech2"};
  return `<div class="ev ${CLS[e.type]||""}"><span class="t">t${e.tick}</span>${e.text}</div>`;
}
// ---------------------------------------------- 暦表示・友好度・神HUD・演出音
const SIM_MONTH0 = 2026 * 12 + 7;   // tick0 = 西暦2026年8月 (1 tick = 1ヶ月)
let muted = false, ac = null;

function simDate(tick, frac = 0.5) {
  const total = SIM_MONTH0 + tick;
  const y = Math.floor(total / 12), m = total % 12 + 1;
  const day = 1 + Math.floor(27 * frac), hh = Math.floor(24 * frac), mm = Math.floor(60 * (24 * frac - hh));
  return `西暦${y}年${m}月${day}日 ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}
function updateDatebar(frac = 0.5) {
  const el = document.getElementById("datebar");
  if (!TICKS.length) return;
  el.style.display = "block";
  el.innerHTML = simDate(TICKS[cur].tick, frac) +
    `<small>tick ${TICKS[cur].tick} / 60（1tick=1ヶ月・日時は演出）</small>`;
}
function trustColor(t) {
  const d = t - 20;
  const hue = d >= 0 ? Math.min(120, d * 1.5) : 0;
  const sat = Math.min(95, 15 + Math.abs(d) * 1.1);
  const light = d >= 0 ? 45 - Math.min(18, d * 0.2) : 48;
  return `hsla(${hue}, ${sat}%, ${light}%, ${Math.min(0.9, 0.25 + Math.abs(d) / 90)})`;
}
function drawTrustEdges(ctx, tick, cv) {
  const nations = tick.nations;
  if (!META?.geo || !Object.values(nations).some(n => n.trust)) return;
  const pos = {};
  for (const [nid, info] of Object.entries(META.geo.nations))
    if (nations[nid] && !nations[nid].collapsed) pos[nid] = project(...info.centroid);
  const curve = (a, b, color, width, dash) => {
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    const lift = Math.min(50, Math.hypot(x2 - x1, y2 - y1) * 0.16);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 - lift, x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
  };
  if (sel.kind === "nation" && nations[sel.id]) {
    const tr = nations[sel.id].trust || {};
    for (const [oid, t] of Object.entries(tr)) if (pos[oid]) curve(sel.id, oid, trustColor(t), 0.8 + Math.abs(t - 20) / 45);
  } else {
    const pairs = [];
    for (const a of Object.keys(pos)) {
      const tr = nations[a].trust || {};
      for (const b of Object.keys(tr)) if (a < b && pos[b])
        pairs.push({ a, b, mean: (tr[b] + (nations[b].trust?.[a] ?? 20)) / 2 });
    }
    pairs.sort((x, y) => y.mean - x.mean);
    for (const q of pairs.slice(0, 6)) curve(q.a, q.b, trustColor(q.mean), 2.2, [7, 5]);
    for (const q of pairs.slice(-6)) if (q.mean < 20) curve(q.a, q.b, trustColor(q.mean), 2.2);
  }
}
// ---- 神介入HUD（地図下部のシミュレーターゲーム風ボタン列） ----
const GOD_HUD = [
  { label: "⚓ 封鎖", kind: "cp", act: () => intervene("close_chokepoint", { chokepoint: sel.id, duration: +qs("#hud_dur").value }) },
  { label: "⚓ 開放", kind: "cp", act: () => intervene("open_chokepoint", { chokepoint: sel.id }) },
  { label: "💸 救済", kind: "nation", act: () => intervene("bailout", { nation: sel.id }) },
  { label: "🌾 旱魃", kind: "nation", act: () => intervene("disaster", { nation: sel.id, kind: "drought" }) },
  { label: "📰 偽情報", kind: "nation", act: () => intervene("disinfo", { target: sel.id, intensity: 0.6 }) },
  { label: "✨ 資源+2", kind: "nation", act: () => intervene("create_resource", { nation: sel.id, resource: qs("#hud_res").value, quantity: 2 }) },
  { label: "💥 資源消滅", kind: "nation", act: () => intervene("destroy_resource", { nation: sel.id, resource: qs("#hud_res").value }) },
  { label: "🧪 技術授与", kind: "nation", act: () => intervene("grant_tech", { nation: sel.id, tech: qs("#hud_tech").value }) },
  { label: "😠 好戦↑", kind: "nation", act: () => intervene("set_param", { nation: sel.id, param: "aggression", value: 0.2 }) },
  { label: "🕊️ 好戦↓", kind: "nation", act: () => intervene("set_param", { nation: sel.id, param: "aggression", value: -0.2 }) },
  { label: "📉 利上げ+5%", kind: "world", act: () => intervene("rate_hike", { value: 0.05 }) },
  { label: "🚫 技術禁止", kind: "world", act: () => intervene("ban_tech", { tech: qs("#hud_tech").value }) },
];
const qs = q => document.querySelector(q);
function initGodBar() {
  const bar = qs("#godbar");
  bar.innerHTML = `<span class="tgt" id="hud_tgt">対象なし</span>` +
    `<select id="hud_dur" title="封鎖期間（ヶ月）"><option>6</option><option selected>12</option><option>24</option><option>60</option></select>` +
    `<select id="hud_res" title="資源の種類">${["oil","gas","grain","fab","mineral","orbit"].map(r=>`<option>${r}</option>`).join("")}</select>` +
    `<select id="hud_tech" title="技術">${TECHS.map(t=>`<option>${t}</option>`).join("")}</select>` +
    GOD_HUD.map((b, i) => `<button data-i="${i}" data-kind="${b.kind}" onclick="GOD_HUD[${i}].act()" title="${b.kind === "nation" ? "国家選択時に有効" : b.kind === "cp" ? "海峡選択時に有効" : "常時有効（全世界）"}">${b.label}</button>`).join("");
  updateGodBar();
}
function updateGodBar() {
  const bar = qs("#godbar"); if (!bar || !bar.children.length) return;
  const t = qs("#hud_tgt");
  if (sel.kind === "nation") t.innerHTML = `対象: <b>${META?.geo?.nations?.[sel.id]?.name || sel.id}</b>`;
  else if (sel.kind === "cp") t.innerHTML = `対象: <b>${sel.id}</b>`;
  else t.innerHTML = "対象なし（国家/海峡をクリック）";
  bar.querySelectorAll("button").forEach(b => {
    const k = b.dataset.kind;
    b.disabled = (k === "nation" && sel.kind !== "nation") || (k === "cp" && sel.kind !== "cp");
  });
}
// ---- 大イベント演出: タイムライン発光 + 音 ----
const MAJOR_TYPES = { sovereign_default: 220, war_start: 110, collapse: 165, price_spike: 440, god_intervention: 660 };
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { } }
  if (ac && ac.state === "suspended") ac.resume();
}
function toggleMute() {
  muted = !muted;
  document.getElementById("mutebtn").textContent = muted ? "🔇" : "🔊";
  if (!muted) initAudio();
}
function majorFeedback(types) {
  const tl = document.getElementById("timeline");
  tl.classList.remove("flash"); void tl.offsetWidth; tl.classList.add("flash");
  if (muted || !ac || !types.length) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sawtooth";
  o.frequency.value = Math.min(...types.map(t => MAJOR_TYPES[t] || 330));
  g.gain.setValueAtTime(0.001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.12, ac.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.5);
}
document.addEventListener("click", () => initAudio(), { once: true });
initGodBar();

function render(i) {
  if (!TICKS.length) return;
  cur=i; const tick=TICKS[i];
  renderMap(tick); renderStats(tick); renderFeed(tick);
  updateDatebar();
  updateGodBar();
}
function renderMap(tick) {
  const cv=document.getElementById("map"), ctx=cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#0e2233"; ctx.fillRect(0,0,cv.width,cv.height);
  const nations=tick.nations;
  const claim=new Map();
  if (META?.geo) for (const [nid,info] of Object.entries(META.geo.nations))
    for (const g of info.geo_ids||[]) { const idx=GEO.byName[g]; if (idx!==undefined) claim.set(idx,nid); }
  const collapsed=new Set(Object.entries(nations).filter(([,n])=>n.collapsed).map(([id])=>id));
  const defaulted=new Set(Object.entries(nations).filter(([,n])=>n.defaults>0).map(([id])=>id));
  GEO.features.forEach((f,idx)=>{
    const nid=claim.get(idx); const selHere = sel.kind==="nation" && sel.id===nid;
    ctx.beginPath();
    for (const ring of f.rings) ring.forEach(([lon,lat],k)=>{ const [x,y]=project(lon,lat); k?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.closePath();
    if (nid && nations[nid]) {
      ctx.fillStyle=nations[nid].color; ctx.fill();
      if (collapsed.has(nid)) { ctx.fillStyle="rgba(13,17,23,.55)"; ctx.fill(); }
    } else { ctx.fillStyle="#22303c"; ctx.fill(); }
    if (defaulted.has(nid)) { ctx.fillStyle="rgba(255,107,53,.35)"; ctx.fill(); }
    ctx.strokeStyle = selHere ? "#ffffff" : "rgba(13,17,23,.9)"; ctx.lineWidth = selHere?1.8:1; ctx.stroke(); ctx.lineWidth=1;
  });
  // routes
  if (META?.geo) {
    for (const r of META.geo.routes) {
      const imp=META.geo.nations[r.importer], exp=META.geo.nations[r.exporter]; if(!imp||!exp) continue;
      const anyClosed=(r.chokepoints||[]).some(n=>tick.chokepoints?.[n]);
      const [x1,y1]=project(...exp.centroid), [x2,y2]=project(...imp.centroid);
      const mx=(x1+x2)/2, my=(y1+y2)/2, lift=Math.min(60,Math.hypot(x2-x1,y2-y1)*0.18), sign=my<cv.height/2?-1:1;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(mx,my+lift*sign,x2,y2);
      if (anyClosed){ ctx.strokeStyle="rgba(248,81,73,.65)"; ctx.setLineDash([5,4]); ctx.lineWidth=1.8; }
      else { ctx.strokeStyle=COMMO_COLOR[r.commodity]||"rgba(200,200,200,.3)"; ctx.setLineDash([]); ctx.lineWidth=1.1; }
      ctx.stroke(); ctx.setLineDash([]);
    }
    drawTrustEdges(ctx, tick, cv);
    for (const cp of META.geo.chokepoints) {
      const [x,y]=project(cp.lon,cp.lat);
      const selHere = sel.kind==="cp" && sel.id===cp.name;
      ctx.font="14px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(tick.chokepoints?.[cp.name]?"⛔":"⚓", x, y);
      ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2);
      ctx.strokeStyle = selHere ? "#ffffff" : (tick.chokepoints?.[cp.name] ? "#f85149" : "rgba(255,255,255,.35)");
      ctx.lineWidth = selHere?2:1.2; ctx.stroke(); ctx.lineWidth=1;
    }
    for (const [nid,n] of Object.entries(nations)) {
      const info=META.geo.nations[nid]; if(!info) continue;
      const [x,y]=project(...info.centroid);
      const hasLand=(info.geo_ids||[]).some(g=>GEO.byName[g]!==undefined);
      if (!hasLand){ ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fillStyle=n.color; ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.stroke(); }
      ctx.font="600 11px sans-serif"; ctx.textAlign="center"; ctx.fillStyle="rgba(255,255,255,.9)";
      ctx.fillText(n.name, x, y+20);
      if (n.at_war_with?.length) ctx.fillText("⚔️", x, y-14);
      if (n.collapsed) ctx.fillText("💀", x+12, y-12);
      if (n.defaults>0) ctx.fillText("🏦✖", x-14, y-12);
    }
  }
}
function renderStats(tick) {
  const el=document.getElementById("statbody");
  let rows=`<table><tr><th></th><th>GDP</th><th>物価↑</th><th>安定</th><th>債務</th><th>破綻</th></tr>`;
  for (const [nid,n] of Object.entries(tick.nations)) {
    rows+=`<tr onclick="selectNation('${nid}')">
      <td><span style="color:${n.color}">●</span> ${n.name}${n.collapsed?" 💀":""}${n.at_war_with?.length?" ⚔️":""}</td>
      <td class="num">${n.gdp.toFixed(1)}</td><td class="num">${(n.inflation*100).toFixed(1)}%</td>
      <td class="num">${n.stability.toFixed(0)}</td>
      <td class="num" style="color:${n.debt_gdp>130?'#f85149':(n.debt_gdp>100?'#e3b341':'inherit')}">${n.debt_gdp.toFixed(0)}%</td>
      <td class="num">${n.defaults||""}</td></tr>`;
  }
  rows+="</table>";
  const m=tick.metrics;
  rows+=`<div style="margin-top:6px;color:var(--dim)">世界GDP <b style="color:var(--text)">${m.world_gdp.toFixed(1)}</b>・安定 ${m.mean_stability.toFixed(1)}・戦争 ${m.wars}・崩壊 ${m.collapsed}・平均債務 ${(m.mean_debt_gdp||0).toFixed(0)}%・破綻 <b style="color:${m.defaults>0?'#ff6b35':'var(--text)'}">${m.defaults||0}</b></div>`;
  el.innerHTML=rows;
}
function renderFeed(tick) {
  const godHtml = GOD_EVENTS.slice(-8).reverse().map(evRow).join("");
  document.getElementById("feedbody").innerHTML = godHtml + ((tick.events||[]).slice().reverse().map(evRow).join("") || '<div class="hint">（イベント待ち）</div>');

  for (const t of TICKS) for (const e of t.events||[]) counts[e.type]=(counts[e.type]||0)+1;
  document.getElementById("cascadeinfo").textContent = Object.entries(counts).map(([k,v])=>`${k}:${v}`).join(" ");
}

function selectNation(nid) { sel = sel.kind==="nation"&&sel.id===nid ? {kind:null,id:null} : {kind:"nation",id:nid}; renderGodPanel(); if(TICKS.length) render(cur); }

// ------------------------------------------------- pane resizing (splitters)
function fitMapCanvas() {
  const cv=document.getElementById("map");
  if (cv.style.display==="none") return;
  const box=document.getElementById("mapwrap").getBoundingClientRect();
  cv.width=Math.max(320, Math.floor(box.width)-8);
  cv.height=Math.max(240, Math.floor(box.height)-8);
  VIEW.scale=Math.min(cv.width/366, cv.height/186);
  VIEW.ox=(cv.width-360*VIEW.scale)/2; VIEW.oy=(cv.height-180*VIEW.scale)/2;
  if (TICKS.length) renderMap(TICKS[cur]);
}
(function initSplitters() {
  const side=document.getElementById("side");
  const vs=document.getElementById("vsplit");
  vs.addEventListener("pointerdown", e => {
    e.preventDefault(); vs.classList.add("drag");
    document.body.style.cursor="col-resize";
    const move=ev => { ev.preventDefault();
      const w=Math.min(Math.max(window.innerWidth-ev.clientX, 320), window.innerWidth-420);
      side.style.width=w+"px"; fitMapCanvas(); };
    const up=() => { document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
      document.body.style.cursor=""; vs.classList.remove("drag"); };
    document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
  });
  vs.addEventListener("dblclick", () => { side.style.width="480px"; fitMapCanvas(); });
  document.querySelectorAll(".hsplit").forEach(h => {
    const pane=document.getElementById(h.dataset.pane);
    const defH=pane.offsetHeight;   // 読み込み時の高さを既定値として記憶
    h.addEventListener("pointerdown", e => {
      e.preventDefault(); h.classList.add("drag");
      document.body.style.cursor="row-resize";
      const move=ev => { ev.preventDefault();
        const top=pane.getBoundingClientRect().top;
        const maxH=side.getBoundingClientRect().height-160;
        pane.style.height=Math.min(Math.max(ev.clientY-top, 70), Math.max(maxH,70))+"px"; };
      const up=() => { document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
        document.body.style.cursor=""; h.classList.remove("drag"); };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
    });
    h.addEventListener("dblclick", () => { pane.style.height=defH+"px"; });
  });
  window.addEventListener("resize", fitMapCanvas);
  // 地図が表示されたら実サイズに合わせる（初回meta受信後）
  const mo=new MutationObserver(() => { if (document.getElementById("map").style.display!=="none") { fitMapCanvas(); mo.disconnect(); } });
  mo.observe(document.getElementById("map"), { attributes:true, attributeFilter:["style"] });
})();

document.getElementById("map").addEventListener("click", async (ev) => {
  if (!META || !GEO) return;
  await loadGeo();
  const cv=document.getElementById("map");
  const rect=cv.getBoundingClientRect();
  const mx=(ev.clientX-rect.left)*(cv.width/rect.width), my=(ev.clientY-rect.top)*(cv.height/rect.height);
  // nearest chokepoint?
  let best=null, bd=14;
  for (const cp of META.geo.chokepoints||[]) {
    const [x,y]=project(cp.lon,cp.lat);
    const d=Math.hypot(x-mx,y-my);
    if (d<bd){bd=d;best=cp;}
  }
  if (best) { sel={kind:"cp",id:best.name}; renderGodPanel(); render(cur); return; }
  // nearest nation centroid?
  best=null; bd=16;
  for (const [nid,info] of Object.entries(META.geo.nations)) {
    const [x,y]=project(...info.centroid);
    const d=Math.hypot(x-mx,y-my);
    if (d<bd){bd=d;best=nid;}
  }
  if (best) { selectNation(best); return; }
  // country fill hit
  const [lon,lat]=unproject(mx,my);
  const idx=GEO.features.findIndex(f=>f.rings.some(ring=>pointInRing(lon,lat,ring)));
  if (idx>=0) {
    const claim=new Map();
    for (const [nid,info] of Object.entries(META.geo.nations))
      for (const g of info.geo_ids||[]) { const gi=GEO.byName[g]; if(gi!==undefined) claim.set(gi,nid); }
    const nid=claim.get(idx);
    if (nid) { selectNation(nid); return; }
  }
  sel={kind:null,id:null}; renderGodPanel(); render(cur);
});
function pointInRing(x,y,ring){ let inside=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const [xi,yi]=ring[i],[xj,yj]=ring[j]; if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside; } return inside; }

// ---------------------------------------------------------------- boot
(async () => { await loadGeo(); connect(); })();
